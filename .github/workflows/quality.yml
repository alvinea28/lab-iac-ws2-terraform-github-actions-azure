name: Workshop quality
on:
  push:
    branches: [dev, main, 'lab/**', 'workshop/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.16.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix app --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Validate the valid learner input or the precise expected purple teaching case
        run: node scripts/check.mjs
      - name: Run unit, security, guide and local HTTP regressions
        run: npm test
